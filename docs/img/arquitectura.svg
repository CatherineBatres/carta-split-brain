<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f1f1e"/>
    </marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8481c"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1f1f1e">Arquitectura split brain: qué corre dónde</text>

  <!-- Zonas -->
  <rect x="30" y="64" width="1020" height="716" rx="14" fill="#f3f7fd" stroke="#2a78d6" stroke-width="2"/>
  <text x="50" y="94" font-size="16" font-weight="700" fill="#184f95">TU COMPUTADORA · el salario, el nombre y la nota nunca salen de aquí</text>
  <rect x="1100" y="330" width="270" height="200" rx="14" fill="#fdf3ee" stroke="#eb6834" stroke-width="2"/>
  <text x="1120" y="360" font-size="16" font-weight="700" fill="#b8481c">NUBE</text>

  <!-- Carriles -->
  <text x="320" y="128" font-size="13" font-weight="700" fill="#5f5e58">CAMINO PRIVADO (usa el salario)</text>
  <line x1="50" y1="372" x2="1030" y2="372" stroke="#c9d8ee" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="320" y="402" font-size="13" font-weight="700" fill="#5f5e58">CAMINO DE LA CARTA (datos ya limpios)</text>

  <!-- Entrada -->
  <rect x="60" y="150" width="200" height="46" rx="23" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.5"/>
  <text x="160" y="178" font-size="14" text-anchor="middle" fill="#1f1f1e">Persona usuaria</text>
  <rect x="60" y="300" width="200" height="84" rx="8" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.5"/>
  <text x="160" y="336" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Formulario</text>
  <text x="160" y="358" font-size="13" text-anchor="middle" fill="#5f5e58">Streamlit en 127.0.0.1</text>

  <!-- Camino privado -->
  <rect x="320" y="142" width="230" height="74" rx="8" fill="#ffffff" stroke="#5f5e58" stroke-width="1.5"/>
  <text x="435" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Reglas (sin modelo)</text>
  <text x="435" y="194" font-size="13" text-anchor="middle" fill="#5f5e58">% de aumento · rango · cuándo</text>

  <rect x="320" y="240" width="230" height="74" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="435" y="270" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Ollama · modelo local</text>
  <text x="435" y="292" font-size="13" text-anchor="middle" fill="#1f1f1e">requisitos de la oferta</text>

  <rect x="610" y="186" width="210" height="84" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="715" y="220" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Ollama · modelo local</text>
  <text x="715" y="243" font-size="13" text-anchor="middle" fill="#1f1f1e">nota de negociación</text>

  <rect x="870" y="204" width="160" height="48" rx="24" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.5"/>
  <text x="950" y="233" font-size="14" font-weight="700" text-anchor="middle" fill="#1f1f1e">Nota privada</text>

  <!-- Camino de la carta -->
  <rect x="320" y="420" width="230" height="84" rx="8" fill="#ffffff" stroke="#5f5e58" stroke-width="1.5"/>
  <text x="435" y="452" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Sanitizador (regex)</text>
  <text x="435" y="474" font-size="13" text-anchor="middle" fill="#5f5e58">nombre · empleador · montos</text>
  <text x="435" y="492" font-size="13" text-anchor="middle" fill="#5f5e58">correo · teléfono</text>

  <rect x="610" y="420" width="210" height="84" rx="8" fill="#ffffff" stroke="#1f1f1e" stroke-width="2.5"/>
  <text x="715" y="454" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Router + guardián</text>
  <text x="715" y="477" font-size="13" text-anchor="middle" fill="#5f5e58">lista de permitidos · falla cerrado</text>

  <rect x="610" y="610" width="210" height="84" rx="8" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="715" y="644" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Ollama · modelo local</text>
  <text x="715" y="667" font-size="13" text-anchor="middle" fill="#1f1f1e">carta sin conexión</text>

  <rect x="870" y="610" width="160" height="84" rx="8" fill="#ffffff" stroke="#5f5e58" stroke-width="1.5"/>
  <text x="950" y="644" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Rehidratar</text>
  <text x="950" y="667" font-size="13" text-anchor="middle" fill="#5f5e58">nombre y empleador</text>

  <rect x="855" y="716" width="180" height="48" rx="24" fill="#ffffff" stroke="#1f1f1e" stroke-width="1.5"/>
  <text x="945" y="745" font-size="14" font-weight="700" text-anchor="middle" fill="#1f1f1e">Carta lista para enviar</text>

  <!-- Nube -->
  <rect x="1130" y="420" width="210" height="84" rx="8" fill="#f9d3c2" stroke="#eb6834" stroke-width="1.5"/>
  <text x="1235" y="454" font-size="15" font-weight="700" text-anchor="middle" fill="#1f1f1e">Gemini</text>
  <text x="1235" y="477" font-size="13" text-anchor="middle" fill="#1f1f1e">redacta la carta</text>

  <!-- Flechas -->
  <g fill="none" stroke="#1f1f1e" stroke-width="1.8" marker-end="url(#f)">
    <path d="M160,196 V298"/>
    <path d="M260,322 H290 V179 H318"/>
    <path d="M260,342 H300 V277 H318"/>
    <path d="M260,362 H290 V462 H318"/>
    <path d="M550,179 H580 V214 H608"/>
    <path d="M550,277 H580 V242 H608"/>
    <path d="M820,228 H868"/>
    <path d="M550,462 H608"/>
    <path d="M715,504 V608"/>
    <path d="M820,652 H868"/>
    <path d="M950,694 V714"/>
  </g>
  <g fill="none" stroke="#b8481c" stroke-width="2.2" marker-end="url(#fn)">
    <path d="M820,462 H1128"/>
    <path d="M1235,504 V652 H1032"/>
  </g>

  <!-- Etiquetas de flechas -->
  <rect x="838" y="412" width="196" height="40" rx="4" fill="#f3f7fd"/>
  <text x="936" y="429" font-size="13" text-anchor="middle" fill="#b8481c" font-weight="700">solo campos permitidos,</text>
  <text x="936" y="446" font-size="13" text-anchor="middle" fill="#b8481c" font-weight="700">ya sanitizados</text>
  <text x="728" y="550" font-size="13" fill="#5f5e58">sin conexión,</text>
  <text x="728" y="567" font-size="13" fill="#5f5e58">o envío bloqueado</text>
  <text x="1248" y="585" font-size="13" fill="#b8481c" font-weight="700">carta firmada</text>
  <text x="1248" y="602" font-size="13" fill="#b8481c" font-weight="700">con [[NOMBRE]]</text>

  <!-- Leyenda -->
  <rect x="30" y="806" width="22" height="22" rx="4" fill="#ffffff" stroke="#5f5e58" stroke-width="1.5"/>
  <text x="60" y="822" font-size="13" fill="#1f1f1e">Código determinista (reglas, regex)</text>
  <rect x="320" y="806" width="22" height="22" rx="4" fill="#cde2fb" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="350" y="822" font-size="13" fill="#1f1f1e">Modelo local (Ollama)</text>
  <rect x="530" y="806" width="22" height="22" rx="4" fill="#f9d3c2" stroke="#eb6834" stroke-width="1.5"/>
  <text x="560" y="822" font-size="13" fill="#1f1f1e">Modelo en la nube</text>
  <line x1="720" y1="817" x2="770" y2="817" stroke="#b8481c" stroke-width="2.2" marker-end="url(#fn)"/>
  <text x="780" y="822" font-size="13" fill="#1f1f1e">Único cruce entre tu computadora y la nube</text>
</svg>
